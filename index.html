<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="A beautifully crafted Tic Tac Toe game with AI opponent, smooth animations, and a premium dark theme.">
  <title>Tic Tac Toe — X vs O</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <div class="app-wrapper">
    <!-- Header -->
    <header id="app-header">
      <h1>
        <span class="title-x">X</span>
        <span class="title-sep">&nbsp;vs&nbsp;</span>
        <span class="title-o">O</span>
      </h1>
      <p class="tagline">The timeless strategy showdown</p>
    </header>

    <!-- Mode Selector -->
    <div id="mode-selector">
      <button class="mode-btn active" data-mode="ai" id="mode-ai">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="4" />
          <circle cx="8" cy="9" r="1.5" />
          <circle cx="16" cy="9" r="1.5" />
          <path d="M9 15c.83.67 2.17.67 3 0" />
        </svg>
        vs AI
      </button>
      <button class="mode-btn" data-mode="pvp" id="mode-pvp">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
          <path d="M16 3.13a4 4 0 0 1 0 7.75" />
        </svg>
        2 Players
      </button>
    </div>

    <!-- Scoreboard -->
    <div id="scoreboard">
      <div class="score-card" id="score-x">
        <span class="score-symbol x-symbol">X</span>
        <span class="score-label" id="x-label">You</span>
        <span class="score-value" id="x-score">0</span>
      </div>
      <div class="score-card" id="score-draw">
        <span class="score-symbol draw-symbol">=</span>
        <span class="score-label">Draw</span>
        <span class="score-value" id="draw-score">0</span>
      </div>
      <div class="score-card" id="score-o">
        <span class="score-symbol o-symbol">O</span>
        <span class="score-label" id="o-label">AI</span>
        <span class="score-value" id="o-score">0</span>
      </div>
    </div>

    <!-- Turn Indicator -->
    <div id="turn-bar">
      <div class="turn-pill" id="turn-pill">
        <span id="turn-icon" class="turn-x">X</span>
        <span id="turn-text">Your turn</span>
      </div>
    </div>

    <!-- Game Board -->
    <div id="board-wrapper">
      <div id="board">
        <div class="cell" data-index="0" id="cell-0"></div>
        <div class="cell" data-index="1" id="cell-1"></div>
        <div class="cell" data-index="2" id="cell-2"></div>
        <div class="cell" data-index="3" id="cell-3"></div>
        <div class="cell" data-index="4" id="cell-4"></div>
        <div class="cell" data-index="5" id="cell-5"></div>
        <div class="cell" data-index="6" id="cell-6"></div>
        <div class="cell" data-index="7" id="cell-7"></div>
        <div class="cell" data-index="8" id="cell-8"></div>
      </div>
      <!-- Win line overlay -->
      <svg id="win-line-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
        <line id="win-line" x1="0" y1="0" x2="0" y2="0" />
      </svg>
    </div>

    <!-- Restart -->
    <button id="restart-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
      </svg>
      New Round
    </button>

    <!-- Difficulty (AI mode only) -->
    <div id="difficulty-selector">
      <span class="diff-label">Difficulty</span>
      <div class="diff-buttons">
        <button class="diff-btn" data-diff="easy" id="diff-easy">Easy</button>
        <button class="diff-btn active" data-diff="medium" id="diff-medium">Medium</button>
        <button class="diff-btn" data-diff="hard" id="diff-hard">Hard</button>
      </div>
    </div>
  </div>

  <!-- Result Overlay -->
  <div id="result-overlay" class="hidden">
    <div id="result-card">
      <div id="result-emoji"></div>
      <h2 id="result-title"></h2>
      <p id="result-subtitle"></p>
      <button id="result-play-btn">Play Again</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>

</html>
